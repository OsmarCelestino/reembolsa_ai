# Ambiente de DESENVOLVIMENTO (código montado por volume, artisan serve).
# Produção: compose.prod.yaml (Nginx + PHP-FPM).
services:
  app:
    build:
      context: .
      target: dev
    container_name: reembolsa_ai_app
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  queue:
    build:
      context: .
      target: dev
    container_name: reembolsa_ai_queue
    command: php artisan queue:work rabbitmq --tries=3 --backoff=30
    environment:
      WAIT_FOR_VENDOR: "1"
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  scheduler:
    build:
      context: .
      target: dev
    container_name: reembolsa_ai_scheduler
    command: php artisan schedule:work
    environment:
      WAIT_FOR_VENDOR: "1"
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    container_name: reembolsa_ai_db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-reembolsa_ai}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: reembolsa_ai_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # painel: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12

volumes:
  pgdata:
