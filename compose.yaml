services:
  app:
    build: .
    container_name: reembolsa_ai_app
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - rabbitmq

  db:
    image: pgvector/pgvector:pg16
    container_name: reembolsa_ai_db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-reembolsa_ai}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: reembolsa_ai_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pgdata:
