# Nginx na frente do PHP-FPM. Só public/index.php é executado; nada fora de public/ é servido.
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    server_tokens off;
    client_max_body_size 8m;   # comprovante de até 5 MB + campos do formulário

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Com TLS na frente (load balancer/proxy), ative também:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Qualquer outro .php (ex.: enviado por upload) nunca é executado.
    location ~ \.php$ {
        return 404;
    }

    # Arquivos ocultos (.env, .git...).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
